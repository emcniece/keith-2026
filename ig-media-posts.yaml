  - id: DZx5IK-Se1x
    instagram_url: https://www.instagram.com/p/DZx5IK-Se1x/
    thumbnail: ig-DZx5IK-Se1x.jpg
    headline: "Why Public Safety Is the Biggest Driver of Your Property Tax"
    content: |
      Why is the single biggest driver of our property tax change something we absolutely cannot afford to cut?
    content_after: |
      Public safety is the heaviest adjustment on this term's bill with a cumulative $493 increase. It is the direct financial reality of transitioning our essential services to meet the demands of a rapidly growing city.
      
      Police:  adding 15 new officers, expanding our local detachment to directly lower officer caseloads and keep Langford’s crime rates well below the provincial average.
      
      Fire: Transitioning from a volunteer to a full time department by hiring 27 new members, providing a round-the-clock professional force. This change ensures faster emergency response times and has dramatically minimized local property losses.
      
      Modern infrastructure requires modern funding to protect the people who live here.
      
      ​Next, I will look directly at the impacts of inflation and rising operational contract costs.

  - id: DaD34_fvj91
    instagram_url: https://www.instagram.com/p/DaD34_fvj91/
    thumbnail: ig-DaD34_fvj91.jpg
    headline: "How Municipal Inflation Works (And Why It Hits Harder Than You Think)"
    content: |
      Most people think of inflation in terms of groceries and gas. But for a municipality, inflation looks entirely different, hitting us on things like asphalt, engineering fees, and heavy equipment maintenance.
    content_after: |
      If Langford had kept budget adjustments strictly tied to the standard Cost of Living, we wouldn't have been able to hire the number of police officers or firefighters needed for our growing community. Standard inflation increases don't buy anything new; they just cover the rising price of what we already have.
      
      Recall the growth dividend from adding new residents was not even sufficient to offset these inflationary pressures, let alone add new services.
      
      On top of that, Langford is uniquely vulnerable to these inflationary shifts. Because we operate on a lean model without massive in-house crews, over half of our city budgeted services rely on contracted services. 
      
      These long-term agreements have mandatory inflationary hikes built right into them, meaning when inflation spikes, the bill hits the city automatically and immediately.
      
      Simply maintaining the status quo against these combined pressures accounted for roughly a $380 increase of the total tax adjustment on a representative home this term.
      
      The video breaks down exactly how this impacts our bottom line. Take a look, and be sure to follow along as we look at the other major fiscal drivers in the next post.

  - id: DaHEjdbJjX1
    instagram_url: https://www.instagram.com/p/DaHEjdbJjX1/
    thumbnail: ig-DaHEjdbJjX1.jpg
    headline: "The Westhills Aquatic Centre: Replacing Illusion with Long-Term Stability"
    content: |
      Public finance is not magic.
    content_after: |
      Ignoring costs to keep taxes artificially low isn't sound fiscal management, it is misdirection and illusion. While we all like to entertain ourselves with a magic show, we know better than to be fooled.
      
      The budget adjustments this term regarding the Westhills Aquatic Centre are a prime example of changing how Langford does business. I don't think anyone on Council wanted to spend millions buying a facility that most people thought the city already owned. We would have much rather used those funds to expand our recreation network and build new community spaces. But it makes absolutely no sense to build new centers when bad, pre-existing contracts, mean you cant even keep your current ones open.
      
      The city was locked into an agreement that guaranteed private profits entirely at the taxpayers' expense. 
      
      By stepping in and buying the facility outright, we didn't just protect Langford's last public pool from permanent closure, the numbers show we are forecasted to also save taxpayers over $100 million in rent over the building's life (Yes this is even after the maintenance costs).
      
      Even more importantly, we are using this challenge to secure our long-term stability. Once the loan for this facility is paid off in a few years, that exact funding will automatically roll into Langford’s first-ever Asset Management Plan.
      
      While Langford is a young city, everything young eventually becomes outdated. Our roads, pipes, and facilities are aging. As we saw with the catastrophic water main failures in Calgary, ignoring infrastructure maintenance until it breaks is a recipe for fiscal disaster. Building up reserves today is the best way to lock in the lowest possible cost for maintenance, ensuring the next generation isn't left holding the bag for a crumbling city.
      
      I agree, while the past decision to ignore future costs was not sustainable, the increases this term are also not sustainable. These were never meant to be lasting increases, but a structural catch-up which is now, largely, behind us. 
      
      Watch to see exactly how we are replacing the old illusions with actual, long-term financial stability.

  - id: DaIgwJgjqBt
    instagram_url: https://www.instagram.com/p/DaIgwJgjqBt/
    thumbnail: ig-DaIgwJgjqBt.jpg
    headline: "Park Equity: Making Green Space Work for Every Langford Resident"
    content: |
      When you look at Langford’s overall map, or even look out the window into the distance, we look incredibly green. We have beautiful trails and massive provincial parks right on our doorstep. But as our city grows, a big total number on a spreadsheet doesn't tell the whole story.
    content_after: |
      It is easy to look at the massive green spaces on our periphery and assume we have enough. But this council operates on a core belief: every single resident in Langford deserves the right to access high-quality parks, trails, and nature every single day.
      
      Right now, access is not equal. If you are a parent, a student, or a kid living in a downtown or north-Langford condo on a scorching summer afternoon, a park on the edge of town does you no good if you can’t easily get to it.
      
      As our housing changes, more and more Langford families are raising kids without a private backyard. For them, our public parks are their backyard.
      
      That is why we have established a clear strategy to identify areas in desperate need of park infill. We are shifting our focus to park equity, making deliberate investments to address historically underserved neighborhoods. We are focusing on infill, combining city resources, grants, and development contributions to buy and protect land where people actually live, rather than just letting green space exist on the sidelines.
      
      Our acquisition of the 6-acre Woodlands Park right in the downtown core is the perfect example of this policy in action. Thanks to a tremendous donation from the previous owner and by leveraging public funds, we protected a pristine downtown gem that will serve as an accessible backyard for generations of local families to enjoy.
      
      True fiscal and community management means ensuring your tax dollars are working for you where it actually matters. Watch to see exactly how we are building a more balanced, accessible Langford for everyone while breaking down where your tax dollars went this term.

  - id: DaLFj86FCUT
    instagram_url: https://www.instagram.com/p/DaLFj86FCUT/
    thumbnail: ig-DaLFj86FCUT.jpg
    headline: "The Hidden Internal Debt Behind Langford's Past Infrastructure"
    content: |
      How did Langford build major landmarks like Starlight Stadium or City Centre Park in the past without seemingly raising property taxes?
    content_after: |
      It wasn't magic. It was a strategy, a misdirection, called internal debt.
      
      Think of internal debt like borrowing from your own RRSP to buy your first home or pay for school. It is entirely legal to tap into those savings, but you are always supposed to pay yourself back.
      
      Municipially, Langford regularly borrowed from its own reserve funds to pay for massive infrastructure projects. But unlike a traditional bank loan, there was no mandatory timeline or concrete plan to pay that money back. Because of that, the city still has outstanding internal debts for infrastructure projects that date all the way back to the early 2000s.
      
      To make matters more complicated, new infrastructure always leaves behind a trail of long-term costs. It isn't just the daily operations you have to fund, but the eventual cost to repair and replace things as they age. When you do not plan for those trailing costs, you end up with unstaffed fire halls, or you are forced to sell off public assets entirely like the North Langford Recreation Centre back in 2020.
      
      Debt can be a highly powerful tool for a growing city, but it has to be managed responsibly. A non-trivial chunk of this term's tax adjustment went directly toward paying off these old internal bills, some of which are now over two decades old.
      
      We cannot keep pushing today's bills onto tomorrow's taxpayers. This is exactly why I brought forward a notice of motion to create a formal Internal Borrowing Bylaw. This ensures that the city can no longer borrow from its own reserves without a mandatory, completely transparent plan to pay it back.
      
      True fiscal management means clearing the hidden debts of the past while building a stable foundation for the future. Watch the video below to see exactly how we are modernizing Langford's financial policies while breaking down where your tax dollars went this term.

  - id: DaO9GDNEvBW
    instagram_url: https://www.instagram.com/p/DaO9GDNEvBW/
    thumbnail: ig-DaO9GDNEvBW.jpg
    headline: "Correcting Langford's Unsustainable Fiscal Model"
    content: |
      We inherited an unsustainable fiscal model. For years, Langford used temporary developer amenity funds to artificially lower everyday taxes, running an escalating structural deficit, a practice that the Province recently outlawed entirely.
    content_after: |
      Correcting that broken system required significant, painful budget shifts. The 57% property tax increase over this term was a one-time correction to right the ship, and it is absolutely not sustainable to continue. Our long-term financial plans show these rates leveling out now that the hard work of stabilizing our foundation is done.
      
      The results of that shift are clear. We stopped a system of reverse socialism that diverted public resources to give the largest tax discounts to our wealthiest landowners, big-box stores, and corporate landlords. Instead, we redirected those developer funds into tangible community investments.
      
      By doubling our sidewalk infill budget, we fast-tracked safe routes for our kids around Millstream, Happy Valley, SĆIȺNEW̱ SṮEȽIṮḴEȽ, Ruth King, Spencer, Savory, and Lakewood schools. We also locked in the plans to finish major upcoming corridors on Glen Lake Road to Belmont Secondary and Goldstream East to Spencer Middle School.
      
      True fiscal management means choosing transparency over illusion, progressivity over corporate subsidies, and building a safe city for every family. Watch the video above to see exactly how we fixed the foundation and where your tax dollars went.
