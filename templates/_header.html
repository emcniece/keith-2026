{% assign splash = splash | default: false %}

<header class="ky-inner-header">
  <div class="ky-inner-header__inner">

    <a href="/" class="ky-inner-header__logo-link">
      <img src="{{ theme['keith-logo-white-2x.png'] }}" alt="Re-Elect Keith Yacucha for Langford City Council" class="ky-inner-header__logo" />
    </a>

    {% unless splash %}
      <nav class="ky-inner-header__nav" aria-label="Main navigation">
        <ul class="ky-inner-header__links">
          <li><a href="/about" class="ky-inner-header__link">About Keith</a></li>
          <li><a href="/blog" class="ky-inner-header__link">Blog</a></li>
          <li><a href="/volunteer" class="ky-inner-header__link">Volunteer</a></li>
          <li><a href="/contact" class="ky-inner-header__link">Contact</a></li>
        </ul>
        {% include "ky_social_icons" %}
        <a href="/donate" class="ky-btn ky-btn--donate">Donate</a>
      </nav>
    {% endunless %}

  </div>
</header>
