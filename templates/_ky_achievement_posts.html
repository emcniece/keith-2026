<div id="ky-achievement-placeholder"></div>
<script>
(function () {
  var placeholder = document.getElementById('ky-achievement-placeholder');
  if (!placeholder) return;

  var hrefs = [
    '/progress#responsible-development',
    '/progress#fiscal-accountability',
    '/progress#transparency-engagement',
    '/progress#green-space'
  ];
  var defaultImg = "{{ theme['keith-progress-bg.jpg'] }}";
  var sideImg    = "{{ theme['keith-placeholder.jpg'] }}";

  function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function attr(s) { return String(s||'').replace(/"/g,'&quot;'); }
  function trunc(s, n) {
    var w = String(s||'').trim().split(/\s+/);
    return w.length <= n ? w.join(' ') : w.slice(0, n).join(' ') + '…';
  }

  function sticker(num, txt) {
    if (!num) return '';
    return '<div class="ky-progress__sticker">' +
      '<span class="ky-progress__sticker-num">' + esc(num) + '</span>' +
      '<span class="ky-progress__sticker-label">' + esc(txt) + '</span>' +
      '</div>';
  }

  function buildCard(d, i) {
    var href  = hrefs[i] || '/progress';
    var img   = d.image || (i >= 2 ? sideImg : defaultImg);
    var stick = sticker(d.stickerNum, d.stickerText);
    var tag   = d.tag ? '<span class="ky-progress__tag">' + esc(d.tag) + '</span>' : '';
    var btn   = '<div class="ky-progress__card-footer">' +
      '<a href="' + href + '" class="ky-btn ky-btn--primary">See how ' +
      '<i class="fa-solid fa-chevron-right" aria-hidden="true"></i></a></div>';
    var imgEl = '<div class="ky-progress__card-img">' +
      '<img src="' + attr(img) + '" alt="' + attr(d.headline) + '" />' + stick + '</div>';

    if (i === 0) {
      return '<article class="ky-progress__card ky-progress__card--hero">' + imgEl +
        '<div class="ky-progress__card-body">' + tag +
        '<h3 class="ky-progress__card-heading ky-progress__card-heading--lg">' + esc(d.headline) + '</h3>' +
        '<p class="ky-progress__card-text ky-progress__card-text--lg">' + esc(trunc(d.excerpt, 50)) + '</p>' +
        btn + '</div></article><div class="ky-progress__grid">';
    }
    if (i === 1) {
      return '<article class="ky-progress__card ky-progress__card--feature">' + imgEl +
        '<div class="ky-progress__card-body">' + tag +
        '<h3 class="ky-progress__card-heading ky-progress__card-heading--lg">' + esc(d.headline) + '</h3>' +
        '<p class="ky-progress__card-text ky-progress__card-text--lg">' + esc(trunc(d.excerpt, 50)) + '</p>' +
        btn + '</div></article><div class="ky-progress__stack">';
    }
    return '<article class="ky-progress__card ky-progress__card--side">' + imgEl +
      '<div class="ky-progress__card-body">' + tag +
      '<h3 class="ky-progress__card-heading">' + esc(d.headline) + '</h3>' +
      '<p class="ky-progress__card-text">' + esc(trunc(d.excerpt, 30)) + '</p>' +
      btn + '</div></article>';
  }

  fetch('/achievements')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      var doc = new DOMParser().parseFromString(html, 'text/html');
      var els = Array.from(doc.querySelectorAll('#ky-achievements-data > div')).slice(0, 4);
      if (!els.length) return;

      var out = els.map(function (el, i) {
        return buildCard({
          headline:    el.dataset.headline    || '',
          image:       el.dataset.image       || '',
          stickerNum:  el.dataset.stickerNum  || '',
          stickerText: el.dataset.stickerText || '',
          tag:         el.dataset.tag         || '',
          excerpt:     el.dataset.excerpt     || ''
        }, i);
      }).join('');

      if (els.length >= 2) out += '</div>'; // close .ky-progress__stack
      if (els.length >= 1) out += '</div>'; // close .ky-progress__grid

      placeholder.outerHTML = out;
    })
    .catch(function () {});
})();
</script>
