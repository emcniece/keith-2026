{% include "translation" %}

<footer class="ky-footer">
  <div class="ky-footer__inner">

    <div class="ky-footer__left">
      <img src="{{ theme['keith-logo-white-2x.png'] }}" alt="Re-Elect Keith Yacucha for Langford City Council" class="ky-footer__logo" />
    </div>

    <div class="ky-footer__right">
      {% if site.footer_content.size > 0 %}
        <div class="ky-footer__content">{{ site.footer_content }}</div>
      {% endif %}
      {% include "ky_social_icons" %}
    </div>

  </div>

  <div id="created-with-nb" class="ky-footer__nb">
    <p>{{ t_created_with_nationbuilder }}</p>
  </div>
</footer>
