{% if page.headline.size > 0 %}
  <div class="ky-page-banner__transition">
    <div class="ky-page-banner__peek-strip" aria-hidden="true"></div>
    <main id="content" role="main" class="ky-page-banner__peek-card">
      {% yield %}
    </main>
  </div>
{% else %}
  <main id="content" role="main">
    {% yield %}
  </main>
{% endif %}
